# Local infrastructure. Requires Docker Desktop.
# PostgreSQL can also run natively (see apps/api/.env.example).
name: instagram-clone

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: instagram
      POSTGRES_PASSWORD: instagram_dev
      POSTGRES_DB: instagram
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instagram"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_dev_password
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  postgres-data:
  redis-data:
  minio-data:
